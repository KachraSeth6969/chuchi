<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Error - Chuchi Love App</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .emoji { font-size: 48px; margin-bottom: 20px; }
        h1 { color: #1f2937; margin: 0 0 10px 0; font-size: 24px; font-weight: 600; }
        p { color: #6b7280; margin: 10px 0; line-height: 1.5; }
        .retry-btn {
            background: #d8bff8;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            color: #1f2937;
            font-weight: 500;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .retry-btn:hover { background: #c4a9f5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">💔📱</div>
        <h1>Connection Lost</h1>
        <p>Can't reach Chuchi's world right now. Please check your internet connection and try again.</p>
        
        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>
        
        <p style="font-size: 14px; margin-top: 30px; color: #9ca3af;">
            Make sure you have a stable internet connection and try refreshing the page.
        </p>
    </div>
</body>
</html>
